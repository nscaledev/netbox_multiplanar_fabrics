{% extends 'generic/object.html' %}

{% block content %}
  <div class="card">
    <div class="card-header">
      <strong>{{ detail_spec.card_title }}</strong>
    </div>
    <div class="card-body">
      <table class="table table-hover">
        <tbody>
          {% for field in detail_fields %}
            <tr>
              <th>{{ field.label }}</th>
              <td>
                {% if field.url %}
                  <a href="{{ field.url }}">{{ field.value }}</a>
                {% elif field.is_empty %}
                  &mdash;
                {% else %}
                  {{ field.value }}
                {% endif %}
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
